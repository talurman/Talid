<style>
/* Layer 1 = the AI-default template, copied as generated. Single light look by design. */
:root{--bg:#F5F4F0;--ink:#17171B;--muted:#4E4E57;--line:#E2E0D8;--chip:#D6D4CB;--card:#FFFFFF;--accent:#2F45E0;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit}
.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;width:100%;box-sizing:border-box;margin:0 auto}
header.wrap{padding-block:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.name{margin:0;font-weight:800;font-size:20px}
.pill{min-height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;align-items:center;min-height:0}
.intro{display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:clamp(34px,4.6vw,68px);line-height:1.08;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;font-size:19px;line-height:1.6;color:var(--muted);max-width:460px}
.topics{display:flex;flex-direction:column;gap:20px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:500;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--chip)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:40px;height:440px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:hidden}
.big{margin:0;font-size:64px;line-height:1;font-weight:800;color:var(--accent)}
.panel h2{margin:0;font-size:26px;font-weight:700}
.panel p.body{margin:0;font-size:18px;line-height:1.7;color:#3A3A42}
.pane{display:flex;flex-direction:column;gap:16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
.count{margin:0;font-size:15px;font-weight:500;color:var(--muted)}
.arrow{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.arrow.prev{border:1.5px solid var(--chip);background:#fff}.arrow.next{border:0;background:var(--ink)}
footer.wrap{padding-block:24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--chip);display:inline-block}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:900px){body{overflow:auto}.shell{height:auto;min-height:100%}.stage{grid-template-columns:minmax(0,1fr);gap:32px}.panel{height:auto;min-height:380px;padding:28px}}
/* break layer */
[data-b]{will-change:transform;transform-origin:50% 50%}
#stage3d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#again{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:30;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
#status{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:30;font:12px/1.4 ui-monospace,monospace;color:var(--muted);direction:ltr}
</style>

    </span>

</div>

<button type="button" id="again" hidden>להתחיל מחדש</button>

<script>
// ---- the template's own behaviour (tabs) ----
const TOPICS=[
 {id:'product',label:'מוצר',big:'AI',h:'מה אני עושה היום',p:'מאז 2024 אני המעצבת היחידה של מערכת EdTech מסוג B2B למורים ולתלמידים — מוצר AI לתלמידים ודשבורד למורים. אני מובילה את כל הדרך: מחקר UX והגדרת מוצר, תרשימי זרימה ו-wireframes, ועד UI ב-Figma, יד ביד עם המפתחים.'},
 {id:'3d',label:'תלת-ממד',big:'.GLB',h:'הצד התלת-ממדי',p:'במוצר אני אחראית על פיצ׳רי האווטאר — עורכת נכסי GLB ב-Blender ומשלבת אנימציות Mixamo. ומאז 2023 אני גם מעצבת תלת-ממד עצמאית: מודלים ואבות-טיפוס ב-Rhino וב-Blender.'},
 {id:'web',label:'אתרים',big:'50+',h:'לקוחות שעבדתי איתם',p:'בין 2021 ל-2024 עיצבתי UI/UX, אתרים וגרפיקה ליותר מ-50 לקוחות.'},
 {id:'study',label:'לימודים',big:'HCI',h:'מה אני לומדת',p:'מאז 2025 אני לומדת לתואר שני בעיצוב לסביבה טכנולוגית ב-HIT. הבסיס שלי מגיע מהחלל: תואר ראשון בעיצוב פנים, מבנה וסביבה בשנקר (2019–2023).'},
 {id:'contact',label:'קשר',big:'',h:'בואו נדבר',p:'[כתובת אימייל]'}
];
let cur=0;
const tabsEl=document.getElementById('tabs'),pane=document.getElementById('pane'),count=document.getElementById('count');
TOPICS.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.textContent=t.label;b.dataset.b='';b.onclick=()=>show(i);tabsEl.appendChild(b);});
function show(i){cur=(i+TOPICS.length)%TOPICS.length;const t=TOPICS[cur];
 [...tabsEl.children].forEach((b,k)=>b.setAttribute('aria-selected',k===cur));
 pane.innerHTML=(t.big?`<p class="big"${/[A-Z.+]/.test(t.big)?' dir="ltr"':''}>${t.big}</p>`:'')+`<h2>${t.h}</h2><p class="body">${t.p}</p>`;
 count.textContent='0'+(cur+1)+' / 0'+TOPICS.length;}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('talk').onclick=()=>show(TOPICS.length-1);
show(0);
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const status=document.getElementById('status'), again=document.getElementById('again');
const say=t=>status.textContent=t;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 3D overlay ----------
const canvas=document.getElementById('stage3d');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const VIEW_H=2.9; // world metres visible top-to-bottom; avatar ≈ 60% of the screen
const cam=new THREE.PerspectiveCamera(30,1,0.1,50);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8b4aa,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(2,4,5); scene.add(key);
function fit(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
 const dist=(VIEW_H/2)/Math.tan(THREE.MathUtils.degToRad(15));const cy=VIEW_H/2-0.06;
 cam.position.set(0,cy,dist);cam.lookAt(0,cy,0);cam.updateProjectionMatrix();}
fit(); addEventListener('resize',fit);
const viewW=()=>VIEW_H*cam.aspect;
const screenToWorldX=px=>(px/innerWidth-0.5)*viewW();
const worldToScreenX=x=>(x/viewW()+0.5)*innerWidth;

let avatar,mixer,acts={},current;
fetch('avatar.txt').then(r=>r.text()).then(t=>{const bin=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));new GLTFLoader().parse(bin.buffer,'',g=>{
  avatar=g.scene; scene.add(avatar); avatar.visible=false;
  avatar.traverse(o=>{if(o.isMesh){o.frustumCulled=false;}});
  mixer=new THREE.AnimationMixer(avatar);
  g.animations.forEach(c=>{acts[c.name]=mixer.clipAction(c);});
  ['mma_low_kick','jab_punch','stomp','waving'].forEach(n=>{acts[n].setLoop(THREE.LoopOnce);acts[n].clampWhenFinished=true;});
  avatar.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary){faces.push(o);}});
  say('ready — use the page; the avatar arrives 5s after your first click');
},e=>say('could not load avatar'));}).catch(()=>say('could not load avatar'));

// ---------- facial expressions (shape keys made in Blender + Ready Player Me visemes) ----------
const faces=[];const face={};const faceTgt={};
function setFace(o){for(const k in faceTgt)faceTgt[k]=0;Object.assign(faceTgt,o);}
const EXPR={
  neutral:{},
  curious:{brows_up:0.7,viseme_O:0.25},
  angry:{brows_angry:1,viseme_SS:0.5},
  shout:{brows_angry:1,viseme_aa:0.9},
  effort:{brows_angry:0.8,viseme_E:0.7},
  happy:{smile:1,brows_up:0.4},
  proud:{smile:0.8,brows_up:0.2,viseme_I:0.2}
};
const expr=n=>setFace(EXPR[n]||{});
let blinkT=2+Math.random()*3,blinkV=0;
function updateFace(dt){
  blinkT-=dt; if(blinkT<0){blinkV=1;blinkT=2.2+Math.random()*3.5;}
  blinkV=Math.max(0,blinkV-dt*7);
  const lid=blinkV>0?Math.sin(blinkV*Math.PI):0;
  for(const k of new Set([...Object.keys(face),...Object.keys(faceTgt)])){const t=faceTgt[k]||0;face[k]=(face[k]||0)+(t-(face[k]||0))*Math.min(1,dt*10);}
  face.blink_L=Math.max(lid,faceTgt.blink_L||0);face.blink_R=Math.max(lid,faceTgt.blink_R||0);
  for(const m of faces){const d=m.morphTargetDictionary;for(const k in face){const i=d[k];if(i!==undefined)m.morphTargetInfluences[i]=face[k];}}
}

function play(name,fade=0.25){const a=acts[name];if(!a)return;a.reset().setEffectiveWeight(1).play();
 if(current&&current!==a)current.crossFadeTo(a,fade,false);current=a;return a;}
const waitClip=(a,frac)=>new Promise(r=>{const tgt=a.getClip().duration*frac;const tick=()=>{if(a.time>=tgt||!a.isRunning())r();else requestAnimationFrame(tick)};tick();});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function turnTo(y,ms=350){return new Promise(r=>{const s=avatar.rotation.y,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/ms);avatar.rotation.y=s+(y-s)*k;k<1?requestAnimationFrame(f):r()};requestAnimationFrame(f);});}
function walkTo(px,speed=1.1){return new Promise(r=>{const tx=screenToWorldX(px);avatar.rotation.y=tx<avatar.position.x?-Math.PI/2:Math.PI/2;play('female_walk');
 let last=performance.now();const f=t=>{const dt=(t-last)/1000;last=t;const d=tx-avatar.position.x;const step=Math.sign(d)*speed*dt;
  if(Math.abs(d)<=Math.abs(step)){avatar.position.x=tx;r();}else{avatar.position.x+=step;requestAnimationFrame(f);}};requestAnimationFrame(f);});}

// ---------- break physics for DOM pieces ----------
const pieces=[];let simRunning=false;
function launch(els,fromX,power=1){els.forEach(el=>{if(el._p)return;const r=el.getBoundingClientRect();const cx=r.left+r.width/2;
 const dir=Math.sign(cx-fromX)||(Math.random()<.5?-1:1);
 const p={el,x:0,y:0,rot:0,vx:dir*(260+Math.random()*420)*power,vy:-(380+Math.random()*420)*power,vr:(Math.random()-.5)*720,rest:false,bottom:r.bottom,left:r.left,right:r.right,h:r.height};
 el._p=p;pieces.push(p);});
 if(!simRunning){simRunning=true;let last=performance.now();const step=t=>{const dt=Math.min(0.033,(t-last)/1000);last=t;let moving=false;
  for(const p of pieces){if(p.rest)continue;moving=true;p.vy+=2200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
   const floor=innerHeight-6-p.bottom; if(p.y>floor){p.y=floor;p.vy*=-0.28;p.vx*=0.7;p.vr*=0.6;if(Math.abs(p.vy)<60){p.vy=0;p.vr*=0.9;if(Math.abs(p.vx)<20)p.rest=true;}}
   if(p.left+p.x<0){p.x=-p.left;p.vx=Math.abs(p.vx)*0.4}
   if(p.right+p.x>innerWidth){p.x=innerWidth-p.right;p.vx=-Math.abs(p.vx)*0.4}
   p.el.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`;}
  if(moving)requestAnimationFrame(step);else simRunning=false;};requestAnimationFrame(step);}}
const q=s=>[...document.querySelectorAll(s)];
const centerX=el=>{const r=el.getBoundingClientRect();return r.left+r.width/2};

// ---------- the sequence ----------
let started=false,armed=false,timer;
async function run(){
  if(started||!avatar)return;started=true;say('');
  avatar.visible=true;avatar.position.set(screenToWorldX(innerWidth+120),0,0);expr('curious');
  const head=document.querySelector('.intro'),panel=document.getElementById('panel');
  // 1. walk in from the right edge to the headline, punch it
  await walkTo(centerX(head)+innerWidth*0.04);
  await turnTo(-Math.PI/2,150);
  expr('angry');let a=play('jab_punch',0.2); await waitClip(a,0.3);expr('shout');await waitClip(a,0.38);
  launch(q('.intro [data-b]'),worldToScreenX(avatar.position.x),1.1);
  await waitClip(a,0.95);expr('proud');
  // 2. walk to the card, kick it
  await walkTo(centerX(panel)+innerWidth*0.12);
  await turnTo(-Math.PI/2,150);
  expr('effort');a=play('mma_low_kick',0.2); await waitClip(a,0.36);expr('shout');await waitClip(a,0.42);
  launch([...q('.tab'),panel],worldToScreenX(avatar.position.x),1.25);
  await waitClip(a,0.95);
  // 3. stomp: everything left falls
  await turnTo(0,300);
  expr('angry');a=play('stomp',0.2); await waitClip(a,0.45);expr('shout');await waitClip(a,0.5);
  launch(q('[data-b]'),worldToScreenX(avatar.position.x),0.8);
  await waitClip(a,0.95);
  // 4. wave, then idle
  expr('happy');a=play('waving',0.25); await waitClip(a,0.98);
  play('breathing_idle',0.4);expr('proud');
  again.hidden=false;
}
function arm(){if(armed)return;armed=true;clearTimeout(timer);timer=setTimeout(run,reduce?1500:5000);}
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>addEventListener(ev,arm,{passive:true}));
setTimeout(()=>{if(!armed){armed=true;run();}},15000); // fallback for someone who only watches

again.onclick=()=>{pieces.forEach(p=>{p.el.style.transform='';p.el._p=null});pieces.length=0;
 expr('neutral');avatar.visible=false;Object.values(acts).forEach(x=>x.stop());current=null;started=false;armed=false;again.hidden=true;show(0);say('ready — click anything to start the 5s timer');};

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);if(faces.length)updateFace(dt);renderer.render(scene,cam);});
</script>
